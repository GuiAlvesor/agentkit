[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "Kit portátil de agentes (orquestrador, arquiteto, escritor, revisores, guardrail, deployer, release) para Claude Code e Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "claude-agent-sdk>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
agentkit = "agentkit.cli:main"

[tool.setuptools.packages.find]
include = ["agentkit*"]

[tool.setuptools.package-data]
agentkit = ["templates/**/*", "static/*", "hooks/*.py"]
