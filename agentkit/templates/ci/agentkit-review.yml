name: AgentKit PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agentkit-review-${{ '{{' }} github.event.pull_request.number {{ '}}' }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar AgentKit
        run: pip install "{{ ci.install_spec }}"

      - name: Revisar PR (pr-reviewer + guardrail)
        env:
          ANTHROPIC_API_KEY: ${{ '{{' }} secrets.ANTHROPIC_API_KEY {{ '}}' }}
          GH_TOKEN: ${{ '{{' }} github.token {{ '}}' }}
        run: |
          agentkit review --base "origin/${{ '{{' }} github.base_ref {{ '}}' }}" --output review.md
{%- if ci.post_review_comment %}
          gh pr comment ${{ '{{' }} github.event.pull_request.number {{ '}}' }} --body-file review.md
{%- endif %}

      - name: Falhar se o guardrail bloquear
        run: "! grep -q 'GUARDRAIL: BLOQUEIA' review.md"
